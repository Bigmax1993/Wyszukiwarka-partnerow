[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: testy jednostkowe (bez sieci)
    integration: testy integracyjne (pliki, pipeline)
    regression: testy regresyjne discovery/filtrów
    api_live: testy na żywo API (Serper, Anthropic) — wymagają kluczy
