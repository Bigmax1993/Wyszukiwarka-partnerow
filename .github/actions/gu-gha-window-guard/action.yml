name: GU GHA schedule window guard
description: >-
  Cron: aktywny co 6 tygodni od 2026-09-21 (pon–pt discovery,
  niedziela tego tygodnia → backfill/excel).
  workflow_dispatch zawsze przechodzi (active=true).
  Opcjonalnie env: GU_CADENCE_ANCHOR (YYYY-MM-DD), GU_CADENCE_DAYS (domyślnie 42).
outputs:
  active:
    description: "true = uruchom pipeline, false = pomiń scheduled"
    value: ${{ steps.check.outputs.active }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        TZ=Europe/Warsaw
        export TZ

        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          echo "Guard: workflow_dispatch → active=true"
          echo "active=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        ANCHOR="${GU_CADENCE_ANCHOR:-2026-09-21}"
        CADENCE_DAYS="${GU_CADENCE_DAYS:-42}"
        DOW=$(date +%u)   # 1=Mon … 7=Sun
        TODAY=$(date +%Y-%m-%d)
        # Poniedziałek tygodnia ISO (dla nd: dziś − 6)
        MONDAY=$(date -d "$TODAY - $((DOW - 1)) days" +%Y-%m-%d)

        echo "Guard: today=$TODAY (DOW=$DOW) monday=$MONDAY anchor=$ANCHOR every=${CADENCE_DAYS}d"

        ANCHOR_EPOCH=$(date -d "$ANCHOR" +%s)
        MONDAY_EPOCH=$(date -d "$MONDAY" +%s)
        DAYS=$(( (MONDAY_EPOCH - ANCHOR_EPOCH) / 86400 ))

        ACTIVE=false
        REASON=""

        if [ "$DAYS" -lt 0 ]; then
          REASON="przed pierwszym cyklem (anchor $ANCHOR)"
        elif [ $(( DAYS % CADENCE_DAYS )) -ne 0 ]; then
          NEXT=$(( CADENCE_DAYS - (DAYS % CADENCE_DAYS) ))
          REASON="poza cyklem co ${CADENCE_DAYS}d (dni od anchor=$DAYS; następny pon za ~${NEXT}d)"
        else
          # Ten tydzień (pon=anchor+n*cadence) jest aktywny
          if [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ]; then
            ACTIVE=true
            REASON="tydzień cyklu discovery (pon $MONDAY)"
          elif [ "$DOW" -eq 7 ]; then
            ACTIVE=true
            REASON="niedziela domknięcia cyklu (pon $MONDAY)"
          else
            REASON="sobota — brak jobów GU"
          fi
        fi

        if [ "$ACTIVE" = "true" ]; then
          echo "Guard: active=true ($REASON)"
          echo "active=true" >> "$GITHUB_OUTPUT"
        else
          echo "Guard: active=false ($REASON)"
          echo "active=false" >> "$GITHUB_OUTPUT"
        fi
