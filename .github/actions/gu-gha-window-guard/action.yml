name: GU GHA schedule window guard
description: >-
  Cron: aktywny co 2 tygodnie od kotwicy 2026-09-21 (pon–pt discovery,
  niedziela tego tygodnia → backfill/excel).
  workflow_dispatch zawsze przechodzi (active=true).
outputs:
  active:
    description: "true = uruchom pipeline, false = pomiń scheduled"
    value: ${{ steps.check.outputs.active }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        # Poniedziałek pierwszego cyklu (Europe/Warsaw)
        GU_CADENCE_ANCHOR_MONDAY: "2026-09-21"
        GU_CADENCE_WEEKS: "2"
      run: |
        set -euo pipefail
        TZ=Europe/Warsaw
        export TZ

        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          echo "Guard: workflow_dispatch → active=true"
          echo "active=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        ANCHOR="${GU_CADENCE_ANCHOR_MONDAY:-2026-09-21}"
        EVERY=$(( ${GU_CADENCE_WEEKS:-2} * 7 ))
        DOW=$(date +%u)   # 1=Mon … 7=Sun
        TODAY=$(date +%Y-%m-%d)

        echo "Guard: today=$TODAY (DOW=$DOW) event=$EVENT_NAME anchor=$ANCHOR every=${EVERY}d"

        # Poniedziałek bieżącego tygodnia ISO (pon–niedz)
        if [ "$DOW" -eq 7 ]; then
          WEEK_MON=$(date -d "$TODAY - 6 days" +%Y-%m-%d)
        else
          WEEK_MON=$(date -d "$TODAY - $(( DOW - 1 )) days" +%Y-%m-%d)
        fi

        ANCHOR_EPOCH=$(date -d "$ANCHOR" +%s)
        WEEK_MON_EPOCH=$(date -d "$WEEK_MON" +%s)
        DELTA_DAYS=$(( (WEEK_MON_EPOCH - ANCHOR_EPOCH) / 86400 ))

        ACTIVE=false
        REASON=""

        if [ "$DELTA_DAYS" -lt 0 ]; then
          REASON="przed pierwszym cyklem (anchor $ANCHOR, week_mon $WEEK_MON)"
        elif [ $(( DELTA_DAYS % EVERY )) -ne 0 ]; then
          REASON="tydzień off (co ${GU_CADENCE_WEEKS:-2} tyg.; week_mon=$WEEK_MON, delta=${DELTA_DAYS}d)"
        elif [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ]; then
          ACTIVE=true
          REASON="cykl co ${GU_CADENCE_WEEKS:-2} tyg. discovery (week_mon=$WEEK_MON)"
        elif [ "$DOW" -eq 7 ]; then
          ACTIVE=true
          REASON="cykl co ${GU_CADENCE_WEEKS:-2} tyg. niedziela backfill/excel (week_mon=$WEEK_MON)"
        else
          REASON="sobota — brak jobów GU"
        fi

        if [ "$ACTIVE" = "true" ]; then
          echo "Guard: active=true ($REASON)"
          echo "active=true" >> "$GITHUB_OUTPUT"
        else
          echo "Guard: active=false ($REASON)"
          echo "active=false" >> "$GITHUB_OUTPUT"
        fi
