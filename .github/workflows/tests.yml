name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs
      USE_GEMINI_REPLY_INTELLIGENCE: "0"
      PYTHONUTF8: "1"
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile core modules
        run: |
          python -m py_compile kanbud_bootstrap.py
          python -m py_compile campaign_data_paths.py
          python -m py_compile de_gu_bauunternehmen_scraper.py
          python -m py_compile scripts/send_excel_gmail.py

      - name: Unit tests
        run: python -m pytest tests/unit -m unit -v --tb=short

      - name: Integration tests (offline)
        run: python -m pytest tests/integration -m "integration and not api_live" -v --tb=short

      - name: Regression tests
        run: |
          python -m unittest tests.test_gu_discovery_regression -v
          python -m unittest tests.test_excel_append tests.test_send_excel_gmail -v
          python -m unittest \
            tests.test_claude_llm_campaign \
            tests.test_claude_contact_extract \
            tests.test_claude_unlimited \
            tests.test_website_full_crawl \
            tests.test_claude_client_retry \
            tests.test_claude_page_text \
            tests.test_discovery_run_state \
            -v

      - name: Scraper smoke (--test)
        run: python de_gu_bauunternehmen_scraper.py --test

      - name: API live (Serper + Anthropic)
        run: python -m pytest tests/integration/test_api_keys.py -m api_live -v --tb=short
