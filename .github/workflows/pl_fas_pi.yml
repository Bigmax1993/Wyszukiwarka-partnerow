name: PL spedycja discovery

# Discovery-only: cron pon-pt 18:00 Europe/Warsaw.
# Guard: co tydzień od 2026-11-02 (GU_CADENCE_DAYS=7).
on:
  schedule:
    - cron: "0 18 * * 1"
      timezone: Europe/Warsaw
    - cron: "0 18 * * 2"
      timezone: Europe/Warsaw
    - cron: "0 18 * * 3"
      timezone: Europe/Warsaw
    - cron: "0 18 * * 4"
      timezone: Europe/Warsaw
    - cron: "0 18 * * 5"
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      discovery_phase:
        description: "Etap discovery: auto (dzien PL) | mon | tue | wed | thu | fri"
        required: false
        type: choice
        options:
          - auto
          - mon
          - tue
          - wed
          - thu
          - fri
        default: auto
      resume_artifact_run_id:
        description: "Wznow z konkretnego run ID (pl-spedycja-wyniki-pi). Puste = wg fazy."
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: gu-pipeline
  cancel-in-progress: false

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  DISABLE_SEND_WINDOW: "1"
  SERPER_DAILY_LIMIT: "1000"
  CLAUDE_UNLIMITED: "1"
  SCRAPER_MAX_RUNTIME_SECONDS: "14400"
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs

jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pl_fas_gha_window_guard
        id: window

  discover:
    needs: guard
    if: ${{ needs.guard.outputs.active == 'true' }}
    runs-on: ubuntu-latest
    # setup ~15 min + scraper do 4h + upload — 270 min ubijało job w trakcie (marnowanie minut)
    timeout-minutes: 310
    env:
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-scraper

      - name: Resolve artifact run (poniedzialek–piatek)
        id: prev_run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESUME_INPUT="${{ github.event_name == 'workflow_dispatch' && inputs.resume_artifact_run_id || '' }}"
          if [ -n "$RESUME_INPUT" ]; then
            echo "run-id=$RESUME_INPUT" >> "$GITHUB_OUTPUT"
            echo "artifact-name=pl-spedycja-wyniki-pi" >> "$GITHUB_OUTPUT"
            echo "resume=1" >> "$GITHUB_OUTPUT"
            echo "phase=manual" >> "$GITHUB_OUTPUT"
            echo "Wznowienie discovery z pl-spedycja-wyniki-pi (run $RESUME_INPUT)"
            exit 0
          fi

          PHASE="${{ github.event_name == 'workflow_dispatch' && inputs.discovery_phase || 'auto' }}"
          if [ "$PHASE" = "auto" ]; then
            DOW=$(TZ=Europe/Warsaw date +%u)
            case "$DOW" in
              1) PHASE=mon ;;
              2) PHASE=tue ;;
              3) PHASE=wed ;;
              4) PHASE=thu ;;
              5) PHASE=fri ;;
              *)
                echo "::warning::Poza pon-pt (DOW=$DOW) — probuje kontynuacje z pi"
                PHASE=thu
                ;;
            esac
          fi
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "Faza discovery: $PHASE"

          if [ "$PHASE" = "mon" ]; then
            # Seed nowego tygodnia z końca poprzedniego cyklu.
            # Discovery zawsze uploaduje pl-spedycja-wyniki-pi; backfill → pl-spedycja-wyniki-thu.
            # Legacy pl-spedycja-wyniki-fri już nie powstaje.
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name=="pl-spedycja-wyniki-thu" and .expired==false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
            ARTIFACT_NAME="pl-spedycja-wyniki-thu"
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name=="pl-spedycja-wyniki-pi" and .expired==false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
              ARTIFACT_NAME="pl-spedycja-wyniki-pi"
            fi
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
              # Nowy tydzień discovery, ale z istniejącym cache firm (kontynuacja kumulacji).
              echo "resume=1" >> "$GITHUB_OUTPUT"
              echo "Poniedzialek: nowy tydzien, seed $ARTIFACT_NAME (run $RUN_ID) + --respect-cache"
            else
              echo "Poniedzialek: brak thu/pi — pierwszy cykl (pusty start)"
            fi
          else
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name=="pl-spedycja-wyniki-pi" and .expired==false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo "::error::Brak pl-spedycja-wyniki-pi — uruchom najpierw poniedzialek discovery (faza mon)"
              exit 1
            fi
            echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "artifact-name=pl-spedycja-wyniki-pi" >> "$GITHUB_OUTPUT"
            echo "resume=1" >> "$GITHUB_OUTPUT"
            echo "Kontynuacja ($PHASE) z pl-spedycja-wyniki-pi (run $RUN_ID)"
          fi

      - name: Download previous Wyniki (kumulacja cache + Excel)
        if: steps.prev_run.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev_run.outputs.artifact-name || 'pl-spedycja-wyniki-pi' }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.prev_run.outputs.run-id }}
          path: .

      - name: Discovery (serper-only, pon-pt)
        run: |
          ARGS="--run-config run_config/pl_fas_spedycja.json --serper-only-discovery --no-auto-email"
          if [ "${{ steps.prev_run.outputs.resume }}" = "1" ]; then
            ARGS="$ARGS --respect-cache"
            echo "Kontynuacja: --respect-cache"
          else
            echo "Nowy etap tygodnia (poniedzialek lub pierwszy cykl)"
          fi
          python pl_fas_spedycja_scraper.py $ARGS

      - name: Upload Wyniki artifact (discovery)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl-spedycja-wyniki-pi
          path: |
            Wyniki/
            wyslane/

      - name: Chain — niedziela backfill (piatek, koniec discovery)
        if: success() && steps.prev_run.outputs.phase == 'fri'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/gha_chain_workflow.sh "PL spedycja niedziela backfill" \
            "artifact_run_id=${{ github.run_id }}"

      # DISABLED: contractor emails — nie chainuj PL spedycja wtorek/poniedzialek send
      # (workflowy disabled_manually; maile B2B nie maja byc wysylane).

      - name: Wznow po timeout (artefakt z tego runu)
        if: cancelled() && steps.prev_run.outputs.phase != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PHASE="${{ steps.prev_run.outputs.phase }}"
          echo "::warning::Discovery przerwane (timeout) — wznawiam fazę $PHASE z run ${{ github.run_id }}"
          gh workflow run pl_fas_pi.yml -R "$GITHUB_REPOSITORY" \
            -f discovery_phase="$PHASE" \
            -f resume_artifact_run_id="${{ github.run_id }}"
