name: GU poniedzialek excel email

# Raport wewnętrzny: końcowy Excel → jeden odbiorca EXCEL_REPORT_TO (svinchak1993@gmail.com).
# NIE jest to wysyłka B2B do kontrahentów. Cron: poniedziałek 08:00 (po prep 07:00).
on:
  schedule:
    - cron: "0 8 * * 1"
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      dry_run:
        description: Tylko podglad (bez wysylki)
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  EXCEL_REPORT_TO: svinchak1993@gmail.com
  DISABLE_EXCEL_REPORT_EMAIL: "0"
  DISABLE_CONTRACTOR_EMAILS: "1"
  DISABLE_GOOGLE_DRIVE: "1"
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs

jobs:
  send-excel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Resolve artifact (prefer mon prep, fallback thu backfill)
        id: artifact_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALL=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --paginate --jq '.artifacts[] | select(.expired==false)')
          pick_latest() {
            local name="$1"
            echo "$ALL" | jq -s --arg n "$name" \
              '[.[] | select(.name == $n)] | sort_by(.created_at) | reverse | .[0] // empty'
          }
          PICK=""
          for NAME in de-gu-wyniki-mon de-gu-wyniki-thu; do
            CAND=$(pick_latest "$NAME")
            if [ -n "$CAND" ] && [ "$CAND" != "null" ]; then
              PICK="$CAND"
              break
            fi
          done
          if [ -z "$PICK" ] || [ "$PICK" = "null" ]; then
            echo "::error::Brak artefaktu mon/thu (uruchom prep lub niedziela backfill)"
            exit 1
          fi
          ARTIFACT=$(echo "$PICK" | jq -r '.name')
          RUN_ID=$(echo "$PICK" | jq -r '.workflow_run.id')
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Pobieram $ARTIFACT z run $RUN_ID"

      - name: Download Wyniki artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_run.outputs.artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact_run.outputs.run-id }}
          path: .

      - name: Send Excel to svinchak1993@gmail.com
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EXCEL_REPORT_TO: svinchak1993@gmail.com
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python scripts/send_excel_gmail.py $ARGS
