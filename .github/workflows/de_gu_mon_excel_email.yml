name: GU poniedzialek excel email

# Raport wewnętrzny: końcowy Excel → svinchak1993@gmail.com + Google Drive.
# Drive: https://drive.google.com/drive/folders/1JMPyphoNX_oS_EjW7LEhf103lvvtsMUL
# Cron: niedziela 09:00 (po backfillu 06:00). NIE jest to wysyłka B2B.
on:
  schedule:
    - cron: "0 9 * * 0"
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      dry_run:
        description: Tylko podglad (bez wysylki / bez Drive)
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  EXCEL_REPORT_TO: svinchak1993@gmail.com
  DISABLE_EXCEL_REPORT_EMAIL: "0"
  DISABLE_CONTRACTOR_EMAILS: "1"
  # Workflow-level OFF; upload step poniżej włącza Drive tylko dla końcowego Excela
  DISABLE_GOOGLE_DRIVE: "1"
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs

jobs:
  send-excel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt -r requirements-drive.txt

      - name: Resolve artifact (prefer thu backfill, fallback mon)
        id: artifact_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALL=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
            --paginate --jq '.artifacts[] | select(.expired==false)')
          pick_latest() {
            local name="$1"
            echo "$ALL" | jq -s --arg n "$name" \
              '[.[] | select(.name == $n)] | sort_by(.created_at) | reverse | .[0] // empty'
          }
          PICK=""
          for NAME in de-gu-wyniki-thu de-gu-wyniki-mon; do
            CAND=$(pick_latest "$NAME")
            if [ -n "$CAND" ] && [ "$CAND" != "null" ]; then
              PICK="$CAND"
              break
            fi
          done
          if [ -z "$PICK" ] || [ "$PICK" = "null" ]; then
            echo "::error::Brak artefaktu thu/mon (uruchom niedziela backfill)"
            exit 1
          fi
          ARTIFACT=$(echo "$PICK" | jq -r '.name')
          RUN_ID=$(echo "$PICK" | jq -r '.workflow_run.id')
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Pobieram $ARTIFACT z run $RUN_ID"

      - name: Download Wyniki artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_run.outputs.artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact_run.outputs.run-id }}
          path: .

      - name: Send Excel to svinchak1993@gmail.com
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EXCEL_REPORT_TO: svinchak1993@gmail.com
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python scripts/send_excel_gmail.py $ARGS

      - name: Upload końcowy Excel na Google Drive
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        env:
          DISABLE_GOOGLE_DRIVE: "0"
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_VERSION_XLSX: "0"
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          test -n "$GDRIVE_FOLDER_ID" || { echo "::error::Brak secret GDRIVE_FOLDER_ID"; exit 1; }
          # Tylko końcowy .xlsx (bez cache/log)
          mkdir -p /tmp/excel-drive/Wyniki
          XLSX=$(ls Wyniki/*kontakte*.xlsx 2>/dev/null | head -n 1)
          if [ -z "$XLSX" ]; then
            XLSX=$(ls Wyniki/*.xlsx 2>/dev/null | head -n 1)
          fi
          if [ -z "$XLSX" ]; then
            echo "::error::Brak pliku Excel w Wyniki/"
            exit 1
          fi
          cp "$XLSX" /tmp/excel-drive/Wyniki/de_gu_bauunternehmen_kontakte.xlsx
          python scripts/gdrive_upload_wyniki.py --campaign-dir /tmp/excel-drive --folder-id "$GDRIVE_FOLDER_ID"
