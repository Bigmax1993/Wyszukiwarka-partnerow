name: PL spedycja poniedzialek prep

# Discovery-only: prep zbędny (Excel robi niedzielny backfill). Cron WYŁĄCZONY.
# Zostaje tylko ręczne workflow_dispatch (rollback / awaryjny rebuild).
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: gu-pipeline
  cancel-in-progress: false

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  SERPER_DAILY_LIMIT: "1000"
  CLAUDE_UNLIMITED: "1"
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs

jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pl_fas_gha_window_guard
        id: window

  prep:
    needs: guard
    if: ${{ needs.guard.outputs.active == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-scraper

      - name: Resolve artifact run (niedziela)
        id: artifact_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="pl-spedycja-wyniki-thu" and .expired==false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::Brak artefaktu pl-spedycja-wyniki-thu (uruchom najpierw PL spedycja niedziela backfill)"
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Pobieram pl-spedycja-wyniki-thu z run $RUN_ID"

      - name: Download cache from niedziela
        uses: actions/download-artifact@v4
        with:
          name: pl-spedycja-wyniki-thu
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact_run.outputs.run-id }}
          path: .

      - name: Prep (rebuild Excel, bez wysylki)
        run: |
          python pl_fas_spedycja_scraper.py --run-config run_config/pl_fas_spedycja.json --rebuild-from-cache

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl-spedycja-wyniki-mon
          path: |
            Wyniki/
            wyslane/

      - name: "DISABLED: Chain — poniedzialek send"
        if: false
        run: echo "contractor send disabled"
