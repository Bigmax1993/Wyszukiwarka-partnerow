name: GU sobota discovery

on:
  schedule:
    # 18:10 UTC = 20:10 Europe/Warsaw (CEST); zimą (CET) ustaw 19:10 UTC
    - cron: "10 18 * * 6"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  DISABLE_SEND_WINDOW: "1"
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Resolve artifact run (poprzedni poniedzialek prep)
        id: prev_run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ARTIFACT in de-gu-wyniki-mon de-gu-wyniki-fri; do
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts" \
              --paginate --jq ".artifacts[] | select(.name==\"$ARTIFACT\" and .expired==false) | .workflow_run.id" | head -1)
            if [ -n "$RUN_ID" ]; then
              echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
              echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Kumuluje cache z $ARTIFACT (run $RUN_ID)"
              exit 0
            fi
          done
          echo "Brak poprzedniego artefaktu — pierwszy cykl"

      - name: Download previous Wyniki (kumulacja cache + Excel)
        if: steps.prev_run.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.prev_run.outputs.artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.prev_run.outputs.run-id }}
          path: .

      - name: Discovery (rotacja 1 Bundesland, serper-only)
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python de_gu_bauunternehmen_scraper.py --rotate-bundesland --serper-only-discovery --no-auto-email

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-gu-wyniki-wed
          path: |
            Wyniki/
            wyslane/
