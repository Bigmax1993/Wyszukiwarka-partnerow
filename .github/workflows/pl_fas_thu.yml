name: PL spedycja niedziela backfill

# Discovery-only: cron nd 06:00 Europe/Warsaw - verify + backfill + Excel.
# Guard: niedziela tygodnia cyklu (co 55 dni od 2026-11-02).
on:
  schedule:
    - cron: "0 6 * * 0"
      timezone: Europe/Warsaw
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Opcjonalnie run ID piątku (pl-spedycja-wyniki-pi). Puste = najnowszy pi."
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: gu-pipeline
  cancel-in-progress: false

env:
  SCRAPER_TIMEZONE: Europe/Warsaw
  SERPER_DAILY_LIMIT: "1000"
  CLAUDE_UNLIMITED: "1"
  KANBUD_PROJECT_ROOT: ${{ github.workspace }}/libs

jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pl_fas_gha_window_guard
        id: window

  backfill:
    needs: guard
    if: ${{ needs.guard.outputs.active == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-scraper

      - name: Resolve artifact run (piatek, koniec discovery pon-pt)
        id: artifact_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FORCED="${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id || '' }}"
          if [ -n "$FORCED" ]; then
            RUN_ID="$FORCED"
            ARTIFACT="pl-spedycja-wyniki-pi"
          else
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name=="pl-spedycja-wyniki-pi" and .expired==false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')
            ARTIFACT="pl-spedycja-wyniki-pi"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::Brak artefaktu discovery (pl-spedycja-wyniki-pi)"
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "Pobieram $ARTIFACT z run $RUN_ID"

      - name: Download cache from discovery (piatek / pl-spedycja-wyniki-pi)
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_run.outputs.artifact || 'pl-spedycja-wyniki-pi' }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact_run.outputs.run-id }}
          path: .

      - name: Verify pending www + backfill and rebuild Excel
        run: |
          CFG="--run-config run_config/pl_fas_spedycja.json"
          python pl_fas_spedycja_scraper.py $CFG --verify-pending-contacts --reverify-all-contacts
          python pl_fas_spedycja_scraper.py $CFG --backfill-emails-from-cache
          python pl_fas_spedycja_scraper.py $CFG --rebuild-from-cache

      - name: Upload Wyniki artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl-spedycja-wyniki-thu
          path: |
            Wyniki/
            wyslane/

      - name: "DISABLED: Chain — sync Google Drive"
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "Drive sync disabled (DISABLE_GOOGLE_DRIVE=1)"
